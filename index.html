<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمون راهبردهای حل مسئله</title>
<style>
*{box-sizing:border-box;font-family:'Tahoma',sans-serif}
body{background:#f0f4f8;margin:0;padding:20px;direction:rtl;text-align:right;color:#333}
.container{max-width:800px;margin:0 auto;background:#fff;padding:30px;border-radius:20px;box-shadow:0 10px 25px rgba(0,0,0,.1);border-top:5px solid #6c5ce7}
h1{color:#6c5ce7;text-align:center;margin-bottom:30px;font-size:24px}
.stats-bar{display:flex;justify-content:space-between;background:#dfe6e9;padding:10px 20px;border-radius:10px;margin-bottom:20px;font-size:14px;color:#2d3436}
.progress-container{width:100%;height:8px;background:#ecf0f1;border-radius:4px;margin-bottom:25px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#6c5ce7,#a29bfe);width:0%;transition:width .5s ease}
.section-tag{display:inline-block;background:#eef2ff;color:#6c5ce7;border-radius:8px;padding:2px 10px;font-size:13px;margin-bottom:10px}
.question{font-size:19px;font-weight:bold;margin-bottom:20px;line-height:2.3;color:#2d3436;border-right:4px solid #fdcb6e;padding-right:15px}
.diagram{text-align:center;margin:0 0 20px}
.diagram svg{max-width:100%;height:auto}
.options{display:grid;gap:15px;grid-template-columns:1fr 1fr}
@media(max-width:600px){.options{grid-template-columns:1fr}.container{padding:18px}}
.option{padding:15px;border:2px solid #dfe6e9;border-radius:12px;cursor:pointer;transition:all .2s;text-align:center;direction:rtl;font-size:18px;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;min-height:65px}
.option:hover{border-color:#a29bfe;background:#f8f9fa}
.option.selected{border-color:#6c5ce7;background:#eef2ff}
.option.correct{border-color:#00b894;background:#e6fffa;color:#00896f}
.option.incorrect{border-color:#ff7675;background:#fff5f5;color:#d63031}
.feedback{margin-top:20px;padding:15px;border-radius:10px;display:none;text-align:center;font-weight:bold}
.feedback.correct{background:#00b894;color:#fff}
.feedback.incorrect{background:#ff7675;color:#fff}
.explanation{margin-top:20px;padding:20px;background:#f1f2f6;border-radius:10px;font-size:15px;display:none;line-height:2.2;color:#2d3436;border:1px solid #dcdde1}
.controls{display:flex;justify-content:center;margin-top:30px}
button{padding:14px 40px;border:none;border-radius:50px;cursor:pointer;font-size:16px;font-weight:bold;width:100%;max-width:300px;color:#fff}
#check-btn{background:linear-gradient(135deg,#6c5ce7,#8e44ad)}
#next-btn{background:linear-gradient(135deg,#00b894,#00cec9);display:none}
.m{display:inline-block;direction:ltr;unicode-bidi:isolate;font-family:'Times New Roman',Tahoma,serif;vertical-align:middle;white-space:nowrap}
.fraction{display:inline-block;vertical-align:middle;text-align:center;font-size:.9em;margin:0 4px}
.numerator{border-bottom:2px solid currentColor;display:block;padding:0 3px}
.denominator{display:block;padding:0 3px}
.footer{margin-top:40px;text-align:center;color:#b2bec3;font-size:12px}
.tw{overflow-x:auto;margin:10px 0}
.tb{border-collapse:collapse;margin:0 auto;background:#fff;font-size:14px;min-width:60%;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.tb th{background:#6c5ce7;color:#fff;padding:7px 10px;border:1px solid #5a4bd1;font-weight:bold}
.tb td{padding:6px 10px;border:1px solid #d0cdee;text-align:center;line-height:1.8}
.tb tr:nth-child(odd) td{background:#f8f7ff}
.tb tr.hl td{background:#c8f7e1!important;color:#00695c;font-weight:bold}
.tb tr.no td{color:#9aa5ab}
.st{background:#fff;border-radius:12px;padding:10px 14px;margin:12px 0;border-right:5px solid #6c5ce7;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.sn{display:inline-block;background:#6c5ce7;color:#fff;border-radius:50%;width:26px;height:26px;text-align:center;line-height:26px;margin-left:8px;font-size:13px}
.sb{margin-top:6px}
.tip,.warn,.ans,.chk{border-radius:10px;padding:9px 13px;margin:10px 0}
.tip{background:#fff8e1;border-right:5px solid #fdcb6e}
.warn{background:#ffecec;border-right:5px solid #ff7675}
.ans{background:#e0fbf1;border-right:5px solid #00b894;font-size:16px}
.chk{background:#e8f4fd;border-right:5px solid #0984e3}
.fig{text-align:center;margin:10px 0;overflow-x:auto}.fig svg{max-width:100%;height:auto}
</style>
</head>
<body>
<div class="container">
  <h1>آزمون راهبردهای حل مسئله</h1>
  <div class="stats-bar">
    <span>✅ صحیح: <b id="correct-count" style="color:#00b894">0</b></span>
    <span>📊 پاسخ داده‌شده: <b id="total-count">0</b> از <b id="all-count">0</b></span>
  </div>
  <div class="progress-container"><div class="progress-fill" id="progress"></div></div>
  <div class="question-box" id="qbox">
    <div class="section-tag" id="section"></div>
    <div class="question" id="question"></div>
    <div class="diagram" id="diagram"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="explanation" id="explanation"></div>
  </div>
  <div class="controls" id="controls">
    <button id="check-btn">بررسی پاسخ</button>
    <button id="next-btn">سؤال بعدی</button>
  </div>
</div>
<div class="footer">ریاضی - راهبردهای حل مسئله</div>
<script>
const m=(c)=>`<span class="m">${c}</span>`;
const frac=(a,b)=>`<span class="fraction"><span class="numerator">${a}</span><span class="denominator">${b}</span></span>`;

// ---------- helpers for explanations ----------
const T=(h,rows,hl=[],strike=false)=>'<div class="tw"><table class="tb"><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+rows.map((r,i)=>'<tr class="'+(hl.includes(i)?'hl':(strike?'no':''))+'">'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</table></div>';
const S=(n,t,b)=>'<div class="st"><span class="sn">'+n+'</span><b>'+t+'</b><div class="sb">'+b+'</div></div>';
const TIP=b=>'<div class="tip">💡 <b>نکته:</b> '+b+'</div>';
const WARN=b=>'<div class="warn">⚠️ <b>اشتباه رایج:</b> '+b+'</div>';
const ANS=b=>'<div class="ans">✅ <b>جواب:</b> '+b+'</div>';
const CHK=b=>'<div class="chk">🔍 <b>بررسی جواب:</b> '+b+'</div>';
const FIG=s=>'<div class="fig">'+s+'</div>';
const OK='<span style="color:#00b894;font-weight:bold">✔</span>', NO='<span style="color:#d63031">✘</span>';
const SV=(w,h,b)=>'<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" font-family="Tahoma">'+b+'</svg>';
const tx=(x,y,t,o='')=>'<text x="'+x+'" y="'+y+'" text-anchor="middle" '+o+'>'+t+'</text>';
// bar model: n boxes + rest = total
function BAR(n,rest,total,box='□'){const bw=44,rw=90,x0=10,y=45,W=x0+n*bw+rw+10;let s='';
 for(let i=0;i<n;i++)s+='<rect x="'+(x0+i*bw)+'" y="'+y+'" width="'+bw+'" height="40" fill="#e4e0ff" stroke="#6c5ce7" stroke-width="2"/>'+tx(x0+i*bw+bw/2,y+26,box,'font-size="16" fill="#6c5ce7"');
 s+='<rect x="'+(x0+n*bw)+'" y="'+y+'" width="'+rw+'" height="40" fill="#ffeaa7" stroke="#e1a800" stroke-width="2"/>'+tx(x0+n*bw+rw/2,y+26,rest,'font-size="13"');
 s+='<path d="M'+x0+' 35 V25 H'+(x0+n*bw+rw)+' V35" fill="none" stroke="#c2185b" stroke-width="2"/>'+tx((x0+W-10)/2,18,'کل = '+total,'font-size="14" fill="#c2185b"');
 s+='<path d="M'+x0+' 95 V105 H'+(x0+n*bw)+' V95" fill="none" stroke="#6c5ce7" stroke-width="2"/>'+tx(x0+n*bw/2,122,n+' تا '+box,'font-size="13" fill="#6c5ce7"');
 return FIG(SV(W,130,s));}
// jumps between numbers of a sequence
function JUMPS(seq,labs,ask=0){const w=64,n=seq.length,W=40+(n-1)*w+40;let s='';
 for(let i=0;i<n-1;i++){const a=40+i*w,b=a+w,mid=(a+b)/2;s+='<path d="M'+(a+12)+' 55 Q'+mid+' 12 '+(b-12)+' 55" fill="none" stroke="#e17055" stroke-width="2"/><polygon points="'+(b-12)+',55 '+(b-20)+',47 '+(b-10)+',45" fill="#e17055"/>'+tx(mid,26,labs[i],'font-size="13" fill="#e17055" direction="ltr"');}
 seq.forEach((v,i)=>{const q=i>=n-ask;s+='<circle cx="'+(40+i*w)+'" cy="75" r="21" fill="'+(q?'#d4f8e8':'#eef2ff')+'" stroke="'+(q?'#00b894':'#6c5ce7')+'" stroke-width="2"/>'+tx(40+i*w,81,v,'font-size="15" font-weight="bold"');});
 return FIG(SV(W,105,s));}
// ---------- question diagrams ----------
const FENCE=SV(320,200,'<rect x="30" y="20" width="260" height="160" fill="none" stroke="#c2185b" stroke-width="2" stroke-dasharray="7 5"/><rect x="60" y="45" width="200" height="110" fill="#8fd16a" stroke="#2f8a3a" stroke-width="2"/>'+tx(160,105,'باغچه','font-size="15"')+tx(160,172,'10 متر','font-size="14"')+tx(236,105,'5 متر','font-size="14"')+'<line x1="160" y1="20" x2="160" y2="45" stroke="#c2185b" stroke-width="1.5"/><text x="168" y="38" font-size="12" fill="#c2185b">1 متر</text><text x="280" y="14" font-size="12" fill="#c2185b" text-anchor="end">نرده</text>');
const FENCE_EXP=SV(340,230,'<rect x="40" y="30" width="260" height="160" fill="#fdecef" stroke="#c2185b" stroke-width="3"/><rect x="70" y="55" width="200" height="110" fill="#8fd16a" stroke="#2f8a3a" stroke-width="2"/>'+tx(170,115,'10 × 5','font-size="15" direction="ltr"')+tx(170,22,'1 + 10 + 1 = 12','font-size="14" fill="#c2185b" direction="ltr"')+'<text x="308" y="115" font-size="14" fill="#c2185b" direction="ltr">7</text>'+tx(55,115,'1','font-size="12" fill="#c2185b"')+tx(285,115,'1','font-size="12" fill="#c2185b"')+tx(170,48,'1','font-size="12" fill="#c2185b"')+tx(170,182,'1','font-size="12" fill="#c2185b"')+tx(170,215,'طول نرده 12 و عرض نرده 7 متر','font-size="13"'));
const BALL=SV(320,210,'<line x1="20" y1="190" x2="300" y2="190" stroke="#5a9a3a" stroke-width="6"/><circle cx="40" cy="22" r="11" fill="#fff" stroke="#000" stroke-width="2"/><polyline points="40,34 70,186 100,100 130,186 160,143 190,186" fill="none" stroke="#c2185b" stroke-width="2"/><text x="20" y="110" font-size="13" direction="ltr">18</text><text x="96" y="92" font-size="13" direction="ltr">9</text><text x="150" y="136" font-size="13" direction="ltr">4/5</text>');
function sticks(){const L=(x1,y1,x2,y2)=>'<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'"/>';let s=L(20,20,20,70);
 const sq=(x0,n)=>{let r=L(x0,20,x0,70);for(let i=0;i<n;i++){const a=x0+i*50,b=a+50;r+=L(a,20,b,20)+L(a,70,b,70)+L(b,20,b,70);}return r;};
 s+=sq(50,1)+sq(130,2)+sq(260,3);
 return SV(440,110,'<g stroke="#d4a017" stroke-width="6" stroke-linecap="round">'+s+'</g><g font-size="13" fill="#c2185b">'+tx(20,98,'شکل 1')+tx(75,98,'شکل 2')+tx(180,98,'شکل 3')+tx(335,98,'شکل 4')+'</g>');}
function grids(){let s='',x=10;const c=22;
 [1,2,3].forEach(n=>{const w=2*n+1;for(let i=0;i<w;i++)for(let j=0;j<3;j++){const col=(j===1&&i%2===1);s+='<rect x="'+(x+i*c)+'" y="'+(10+j*c)+'" width="'+c+'" height="'+c+'" fill="'+(col?'#d5e07a':'#fff')+'" stroke="#2e6b3a" stroke-width="1.5"/>';}
 s+=tx(x+w*c/2,10+3*c+20,'شکل '+n,'font-size="13" fill="#c2185b"');x+=w*c+18;});
 return SV(x,110,s);}
const STICKS=sticks(), GRIDS=grids();
// square garden with trees
function SQTREES(){const o=40,k=30;let s='<rect x="'+o+'" y="'+o+'" width="'+(6*k)+'" height="'+(6*k)+'" fill="#e8f5e9" stroke="#2f8a3a" stroke-width="2"/>';const pts=[];
 for(let i=0;i<3;i++)pts.push([o+i*2*k,o]);for(let i=0;i<3;i++)pts.push([o+6*k,o+i*2*k]);for(let i=0;i<3;i++)pts.push([o+6*k-i*2*k,o+6*k]);for(let i=0;i<3;i++)pts.push([o,o+6*k-i*2*k]);
 pts.forEach((p,i)=>{s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="12" fill="#00b894" stroke="#fff" stroke-width="2"/>'+tx(p[0],p[1]+5,i+1,'font-size="12" fill="#fff" font-weight="bold"');});
 s+=tx(o+3*k,o+3*k,'6 × 6','font-size="15" direction="ltr"')+tx(o+k,o-18,'2 متر','font-size="12" fill="#c2185b"');
 return SV(6*k+2*o,6*k+2*o,s);}
// floors
function FLOORS(){let s='<rect x="90" y="20" width="110" height="210" fill="#fff8e1" stroke="#636e72" stroke-width="2"/>';
 for(let f=1;f<=6;f++){const y=230-(f-1)*35-17;s+='<line x1="90" y1="'+(230-(f-1)*35)+'" x2="200" y2="'+(230-(f-1)*35)+'" stroke="#b2bec3"/>'+tx(55,y+5,'طبقهٔ '+f,'font-size="12"');
  if(f<6)s+='<path d="M210 '+(230-(f-1)*35-4)+' q14 -17 0 -27" fill="none" stroke="#e17055" stroke-width="2"/>'+tx(245,y-12,'15 ثانیه','font-size="11" fill="#e17055"');}
 s+='<circle cx="145" cy="'+(230-17)+'" r="7" fill="#6c5ce7"/>';
 return SV(290,240,s);}
// frog graph
function FROG(){const b=200,u=18,dx=20;let x=30,h=0,pts=[[x,b]];
 for(let j=1;j<=7;j++){x+=dx;h+=3;pts.push([x,b-h*u]);if(j<7){x+=dx;h-=2;pts.push([x,b-h*u]);}}
 let s='';for(let i=0;i<=9;i++)s+='<line x1="25" y1="'+(b-i*u)+'" x2="'+(x+15)+'" y2="'+(b-i*u)+'" stroke="#eee"/>'+tx(15,b-i*u+4,i,'font-size="10"');
 s+='<line x1="25" y1="'+(b-9*u)+'" x2="'+(x+15)+'" y2="'+(b-9*u)+'" stroke="#c2185b" stroke-width="2" stroke-dasharray="5 3"/>'+tx(x-30,b-9*u-6,'بالای دیوار (9 متر)','font-size="11" fill="#c2185b"');
 s+='<polyline points="'+pts.map(p=>p.join(',')).join(' ')+'" fill="none" stroke="#00b894" stroke-width="2.5"/>';
 s+='<circle cx="'+x+'" cy="'+(b-9*u)+'" r="6" fill="#00b894"/>';
 for(let j=1;j<=7;j++)s+=tx(30+(2*j-1)*dx,b+16,j,'font-size="11" fill="#6c5ce7"');
 s+=tx(x/2+10,b+32,'شمارهٔ جهش','font-size="11" fill="#6c5ce7"');
 return SV(x+30,b+40,s);}
// trees on a line
function LINETREES(){const x0=25,k=13;let s='<line x1="'+x0+'" y1="60" x2="'+(x0+20*k)+'" y2="60" stroke="#8d6e63" stroke-width="4"/>';
 for(let i=0;i<=5;i++){const x=x0+i*4*k;s+=tx(x,48,'🌳','font-size="22"')+tx(x,80,i*4,'font-size="12"');if(i<5)s+=tx(x+2*k,100,'فاصلهٔ '+(i+1),'font-size="10" fill="#e17055"');}
 return SV(x0*2+20*k,110,s);}
function HANDS(){const c=[110,100],r=72,P=[];for(let i=0;i<5;i++){const a=-Math.PI/2+i*2*Math.PI/5;P.push([c[0]+r*Math.cos(a),c[1]+r*Math.sin(a)]);}
 let s='';const col=['#6c5ce7','#00b894','#e17055','#0984e3'];
 for(let i=0;i<5;i++)for(let j=i+1;j<5;j++)s+='<line x1="'+P[i][0].toFixed(1)+'" y1="'+P[i][1].toFixed(1)+'" x2="'+P[j][0].toFixed(1)+'" y2="'+P[j][1].toFixed(1)+'" stroke="'+col[i]+'" stroke-width="2.5"/>';
 P.forEach((p,i)=>{s+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="14" fill="#fff" stroke="#2d3436" stroke-width="2"/>'+tx(p[0].toFixed(1),(p[1]+5).toFixed(1),i+1,'font-size="13" font-weight="bold"');});
 return SV(220,190,s);}
const RECT_D=SV(300,190,'<rect x="40" y="30" width="220" height="130" fill="#f5f6fa" stroke="#2d3436" stroke-width="2"/><line x1="40" y1="30" x2="260" y2="160" stroke="#0984e3" stroke-width="2"/><line x1="260" y1="30" x2="40" y2="160" stroke="#0984e3" stroke-width="2"/><circle cx="150" cy="95" r="8" fill="#d63031"/>'+tx(150,80,'دریچه','font-size="12" fill="#d63031"')+'<g font-size="11" fill="#00b894">'+tx(95,55,'a')+tx(205,55,'a')+tx(95,145,'a')+tx(205,145,'a')+'</g>'+tx(150,182,'هر چهار پاره‌خط سبز a هم‌اندازه‌اند','font-size="12"'));
const ANGLE=SV(290,190,'<line x1="40" y1="160" x2="270" y2="160" stroke="#2d3436" stroke-width="2.5"/><line x1="40" y1="160" x2="40" y2="15" stroke="#2d3436" stroke-width="2.5"/><line x1="40" y1="160" x2="230" y2="81" stroke="#e17055" stroke-width="2.5"/><rect x="40" y="145" width="15" height="15" fill="none" stroke="#2d3436"/><path d="M130 160 A90 90 0 0 0 123 125" fill="none" stroke="#00b894" stroke-width="2"/>'+tx(150,148,'□','font-size="14" fill="#00b894"')+'<path d="M76 125 A50 50 0 0 0 40 110" fill="none" stroke="#6c5ce7" stroke-width="2"/>'+tx(80,100,'3□','font-size="14" fill="#6c5ce7" direction="ltr"')+tx(150,183,'□ + 3□ = 90°','font-size="14" direction="ltr"'));
function DOTSQ(){let s='',x=10;[1,2,3,4].forEach(n=>{for(let i=0;i<n;i++)for(let j=0;j<n;j++)s+='<circle cx="'+(x+i*16+8)+'" cy="'+(70-j*16)+'" r="6" fill="#6c5ce7"/>';s+=tx(x+n*8,100,n+'×'+n+' = '+n*n,'font-size="12" direction="ltr"');x+=n*16+30;});return SV(x,110,s);}
const sw=c=>'<span style="display:inline-block;width:14px;height:14px;border-radius:3px;background:'+c+';border:1px solid #999;vertical-align:middle;margin-left:4px"></span>';
const R=s=>'<br>'+s;

const H='راهبرد حذف حالت‌های نامطلوب',D='راهبرد رسم شکل',G='راهبرد الگوسازی',A='راهبرد حدس و آزمایش',N='راهبرد روش‌های نمادین',P='راهبرد الگویابی';
const rawQuestions=[
// 1
{s:H,q:'مجموع سن سه نفر ۱۴ سال و حاصل‌ضرب سن آن‌ها ۷۰ است. سن بزرگ‌ترین نفر چند سال است؟',opts:[m('7'),m('10'),m('14'),m('5')],
exp:S(1,'داده‌ها و خواسته را جدا کنیم','داده‌ها: مجموع سن‌ها = ۱۴ و حاصل‌ضرب سن‌ها = ۷۰. خواسته: سن بزرگ‌ترین نفر.')
+S(2,'همهٔ حالت‌ها را بنویسیم','از شرط ساده‌تر شروع می‌کنیم: سه عدد طبیعی که حاصل‌ضربشان ۷۰ می‌شود. برای اینکه هیچ حالتی جا نماند، عدد اول را از کوچک به بزرگ انتخاب می‌کنیم (۷۰ = ۲ × ۵ × ۷).'
+T(['حالت','سن سه نفر','حاصل‌ضرب','مجموع','قبول؟'],[[1,m('1 , 1 , 70'),70,72,NO],[2,m('1 , 2 , 35'),70,38,NO],[3,m('1 , 5 , 14'),70,20,NO],[4,m('1 , 7 , 10'),70,18,NO],[5,m('2 , 5 , 7'),70,14,OK]],[4],true))
+S(3,'حالت‌های نامطلوب را حذف کنیم','حالت‌هایی که مجموعشان ۱۴ نیست (حالت ۱ تا ۴) کنار می‌روند. فقط حالت ۵ می‌ماند.')
+ANS('سن‌ها ۲، ۵ و ۷ سال است؛ پس بزرگ‌ترین نفر <b>۷ سال</b> دارد.')
+CHK(m('2 + 5 + 7 = 14')+' و '+m('2 × 5 × 7 = 70'))},
// 2

// ---------- logic ----------
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const quizData=rawQuestions.map(q=>{const order=shuffle(q.opts.map((_,i)=>i));return {...q,opts:order.map(i=>q.opts[i]),ans:order.indexOf(0)};});
const FA='۰۱۲۳۴۵۶۷۸۹';
function persianize(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode())){n.nodeValue=n.nodeValue.replace(/-(?=\d)/g,'−').replace(/[0-9]/g,d=>FA[d]);}}
let cur=0,score=0,answered=0,sel=null;
const $=id=>document.getElementById(id);
const els={q:$('question'),sec:$('section'),dg:$('diagram'),o:$('options'),fb:$('feedback'),ex:$('explanation'),check:$('check-btn'),next:$('next-btn'),prog:$('progress'),cc:$('correct-count'),tc:$('total-count'),ac:$('all-count'),controls:$('controls'),box:$('qbox')};
els.ac.textContent=quizData.length;
function load(){
  if(cur>=quizData.length){finish();return;}
  const d=quizData[cur];
  els.sec.textContent=d.s;
  els.q.innerHTML=(cur+1)+'. '+d.q;
  els.dg.innerHTML=d.d||''; els.dg.style.display=d.d?'block':'none';
  els.o.innerHTML='';
  d.opts.forEach((opt,i)=>{const div=document.createElement('div');div.className='option';div.innerHTML=opt;div.onclick=()=>pickOpt(i,div);els.o.appendChild(div);});
  els.fb.style.display='none';els.ex.style.display='none';els.check.style.display='block';els.next.style.display='none';sel=null;
  els.prog.style.width=(cur/quizData.length*100)+'%';
  persianize(document.querySelector('.container'));
}
function pickOpt(i,el){if(els.fb.style.display==='block')return;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');sel=i;}
els.check.onclick=()=>{
  if(sel===null){alert('لطفاً یک گزینه را انتخاب کنید');return;}
  const d=quizData[cur],op=document.querySelectorAll('.option');
  if(sel===d.ans){op[sel].classList.add('correct');els.fb.innerHTML='آفرین! پاسخ صحیح است 🎉';els.fb.className='feedback correct';score++;}
  else{op[sel].classList.add('incorrect');op[d.ans].classList.add('correct');els.fb.innerHTML='پاسخ اشتباه است ❌';els.fb.className='feedback incorrect';}
  els.fb.style.display='block';
  els.ex.innerHTML='<b>📘 توضیح کامل:</b>'+d.exp;els.ex.style.display='block';
  els.check.style.display='none';els.next.style.display='block';
  answered++;els.cc.textContent=score;els.tc.textContent=answered;
  persianize(document.querySelector('.container'));
};
els.next.onclick=()=>{cur++;load();window.scrollTo(0,0);};
function finish(){
  els.box.innerHTML=`<div style="text-align:center;padding:40px"><h2 style="color:#6c5ce7">آزمون به پایان رسید!</h2><p style="font-size:18px">نمرهٔ شما: ${score} از ${quizData.length}</p><button onclick="location.reload()" style="background:#00b894;margin-top:20px">شروع دوباره</button></div>`;
  els.controls.style.display='none';els.prog.style.width='100%';
  persianize(document.querySelector('.container'));
}
load();
</script>
